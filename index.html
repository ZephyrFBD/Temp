<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小学均衡分班系统（正式版）</title>

<style>

:root {
    --primary: #4a90d9;
    --primary-dark: #3a7bc8;
    --secondary: #67c23a;
    --warning: #e6a23c;
    --danger: #f56c6c;
    --dark: #2c3e50;
    --gray: #6c757d;
    --light-gray: #e8ecf1;
    --card-bg: #ffffff;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --radius: 12px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    margin: 0;
    padding: 30px 20px;
}

/* =====================启动画面===================== */
.splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.splash-screen.fade-out {
    opacity: 0;
    visibility: hidden;
}

.splash-logo {
    width: 120px;
    height: 120px;
    background: linear-gradient(135deg, var(--primary), #6e8cdb);
    border-radius: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
    animation: logoFloat 3s ease-in-out infinite;
    box-shadow: 0 20px 60px rgba(74,144,217,0.4);
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.splash-logo svg {
    width: 60px;
    height: 60px;
    fill: white;
}

.splash-title {
    font-size: 32px;
    font-weight: 600;
    color: white;
    margin-bottom: 10px;
    text-align: center;
    letter-spacing: 2px;
}

.splash-subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 50px;
}

.splash-loader {
    width: 200px;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 15px;
}

.splash-loader-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), #6e8cdb);
    border-radius: 2px;
    animation: loading 2s ease-in-out forwards;
}

@keyframes loading {
    0% { width: 0%; }
    30% { width: 30%; }
    60% { width: 60%; }
    80% { width: 80%; }
    100% { width: 100%; }
}

.splash-status {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
}

/* =====================主容器===================== */
.container {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
}

.container.visible {
    opacity: 1;
    transform: translateY(0);
}

/* =====================流程步骤===================== */
.process-header {
    text-align: center;
    margin-bottom: 40px;
}

.process-header h1 {
    color: var(--dark);
    font-size: 28px;
    margin-bottom: 30px;
}

.step-indicator {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0;
}

.step-item {
    display: flex;
    align-items: center;
}

.step-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--light-gray);
    color: var(--gray);
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.3s ease;
}

.step-item.active .step-circle {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 15px rgba(74,144,217,0.4);
}

.step-item.completed .step-circle {
    background: var(--secondary);
    color: white;
}

.step-label {
    margin-left: 10px;
    font-size: 14px;
    color: var(--gray);
    white-space: nowrap;
}

.step-item.active .step-label {
    color: var(--primary);
    font-weight: 600;
}

.step-item.completed .step-label {
    color: var(--secondary);
}

.step-line {
    width: 60px;
    height: 2px;
    background: var(--light-gray);
    margin: 0 15px;
    transition: background 0.3s ease;
}

.step-line.active {
    background: var(--secondary);
}

/* =====================步骤内容区===================== */
.step-content {
    display: none;
    animation: fadeIn 0.5s ease;
}

.step-content.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* =====================步骤1：数据导入===================== */
.step-intro {
    text-align: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #f8fafc 0%, #f0f4f8 100%);
    border-radius: var(--radius);
    margin-bottom: 30px;
}

.step-intro h2 {
    color: var(--dark);
    margin-bottom: 10px;
}

.step-intro p {
    color: var(--gray);
    font-size: 14px;
}

.file-upload-area {
    border: 2px dashed var(--light-gray);
    border-radius: var(--radius);
    padding: 40px;
    text-align: center;
    transition: all 0.3s ease;
    cursor: pointer;
    margin-bottom: 20px;
}

.file-upload-area:hover {
    border-color: var(--primary);
    background: rgba(74,144,217,0.05);
}

.file-upload-area.dragover {
    border-color: var(--primary);
    background: rgba(74,144,217,0.1%);
}

.file-upload-icon {
    font-size: 48px;
    color: var(--primary);
    margin-bottom: 15px;
}

.file-upload-text {
    color: var(--dark);
    font-size: 16px;
    margin-bottom: 5px;
}

.file-upload-hint {
    color: var(--gray);
    font-size: 12px;
}

.file-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px;
    background: #e1f3d8;
    border-radius: 8px;
    color: var(--secondary);
    margin-bottom: 20px;
}

.file-info.error {
    background: #fef0f0;
    color: var(--danger);
}

.class-config {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    padding: 20px;
    background: linear-gradient(135deg, #f8fafc 0%, #f0f4f8 100%);
    border-radius: var(--radius);
    margin-bottom: 30px;
}

.class-config label {
    font-weight: 600;
    color: var(--dark);
}

.class-config input {
    width: 80px;
    padding: 10px;
    border: 1px solid var(--light-gray);
    border-radius: 6px;
    text-align: center;
    font-size: 16px;
}

/* =====================步骤2：执行分班===================== */
.assignment-progress {
    text-align: center;
    padding: 60px 20px;
}

.progress-circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 30px;
    box-shadow: 0 10px 40px rgba(74,144,217,0.4);
}

.progress-circle-inner {
    width: 120px;
    height: 120px;
    background: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.progress-percent {
    font-size: 36px;
    font-weight: 700;
    color: var(--primary);
}

.progress-label {
    font-size: 12px;
    color: var(--gray);
}

.assignment-status {
    font-size: 18px;
    color: var(--dark);
    margin-bottom: 30px;
}

.assignment-log {
    max-width: 400px;
    margin: 0 auto;
    text-align: left;
    background: #f8fafc;
    border-radius: 8px;
    padding: 20px;
    font-size: 13px;
    color: var(--gray);
}

.assignment-log p {
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.assignment-log p::before {
    content: "✓";
    color: var(--secondary);
}

/* =====================步骤3：查看结果===================== */
.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--light-gray);
}

.results-header h2 {
    color: var(--dark);
}

.results-actions {
    display: flex;
    gap: 10px;
}

.summary-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
}

.summary-card {
    background: linear-gradient(135deg, #f8fafc 0%, #fff 100%);
    border: 1px solid var(--light-gray);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
}

.summary-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.summary-card .number {
    font-size: 32px;
    font-weight: 700;
    color: var(--primary);
}

.summary-card .label {
    font-size: 12px;
    color: var(--gray);
    margin-top: 5px;
}

.check-list {
    background: linear-gradient(135deg, #f8fafc 0%, #f0f4f8 100%);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 30px;
}

.check-list h3 {
    font-size: 16px;
    color: var(--dark);
    margin-bottom: 15px;
}

.check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 15px;
    background: white;
    border-radius: 8px;
    margin-bottom: 10px;
    border: 1px solid var(--light-gray);
}

.check-item:last-child {
    margin-bottom: 0;
}

.check-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    font-weight: bold;
}

.check-item.success .check-icon {
    background: var(--secondary);
    color: white;
}

.check-item.error .check-icon {
    background: var(--danger);
    color: white;
}

.class-accordion {
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
}

.accordion-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
}

.accordion-header:hover {
    background: linear-gradient(135deg, var(--primary-dark) 0%, #2d5a9e 100%);
}

.accordion-header .class-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.accordion-header .class-name {
    font-weight: 600;
}

.accordion-header .class-stats {
    font-size: 12px;
    opacity: 0.9;
}

.accordion-header .toggle-icon {
    font-size: 18px;
    transition: transform 0.3s ease;
}

.accordion-header.open .toggle-icon {
    transform: rotate(180deg);
}

.accordion-content {
    display: none;
    padding: 0;
}

.accordion-content.open {
    display: block;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #f8fafc;
    color: var(--dark);
    font-weight: 600;
    font-size: 13px;
    padding: 12px 15px;
    text-align: center;
    border-bottom: 2px solid var(--light-gray);
}

td {
    padding: 12px 15px;
    text-align: center;
    border-bottom: 1px solid var(--light-gray);
    font-size: 14px;
}

tr:last-child td {
    border-bottom: none;
}

tr:hover {
    background: #f8fafc;
}

.student-id {
    font-family: "Consolas", monospace;
    color: var(--primary);
    font-weight: 500;
}

/* =====================步骤4：电子签章===================== */
.signature-section {
    background: linear-gradient(135deg, #fefbf3 0%, #fdf6e8 100%);
    border: 1px solid #f0e6d3;
    border-radius: var(--radius);
    padding: 30px;
    margin-bottom: 30px;
}

.signature-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 25px;
}

.signature-header h2 {
    color: var(--dark);
}

.signature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.signature-item {
    padding: 15px;
    background: white;
    border-radius: 8px;
    border: 1px solid #f0e6d3;
}

.signature-item .key {
    font-size: 12px;
    color: var(--gray);
    margin-bottom: 5px;
}

.signature-item .value {
    font-size: 14px;
    font-weight: 600;
    color: var(--dark);
}

.signature-item.highlight {
    background: linear-gradient(135deg, #e8f4fd 0%, #d4e9fc 100%);
    border-color: var(--primary);
}

.signature-item.highlight .value {
    color: var(--primary);
}

.signature-signature {
    padding: 20px;
    background: white;
    border-radius: 8px;
    border: 1px solid #f0e6d3;
    text-align: center;
}

.signature-signature label {
    display: block;
    font-size: 14px;
    color: var(--gray);
    margin-bottom: 15px;
}

.signature-input {
    width: 100%;
    max-width: 300px;
    padding: 12px 15px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    text-align: center;
    outline: none;
    transition: border-color 0.3s;
}

.signature-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(74,144,217,0.1);
}

.signature-input::placeholder {
    color: #c0c4cc;
}

.signature-line {
    border-bottom: 1px solid var(--dark);
    height: 40px;
}

/* =====================按钮===================== */
.btn-group {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 30px;
}

button {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(74,144,217,0.3);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(74,144,217,0.4);
}

button:active {
    transform: translateY(0);
}

button.secondary {
    background: linear-gradient(135deg, #909399 0%, #73767a 100%);
    box-shadow: 0 2px 8px rgba(144,147,153,0.3);
}

button.secondary:hover {
    box-shadow: 0 4px 12px rgba(144,147,153,0.4);
}

button.export {
    background: linear-gradient(135deg, var(--secondary) 0%, #5daf34 100%);
    box-shadow: 0 2px 8px rgba(103,194,58,0.3);
}

button.export:hover {
    box-shadow: 0 4px 12px rgba(103,194,58,0.4);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

/* =====================完成画面===================== */
.complete-section {
    text-align: center;
    padding: 60px 20px;
}

.complete-icon {
    width: 100px;
    height: 100px;
    background: linear-gradient(135deg, var(--secondary) 0%, #5daf34 100%);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 30px;
    font-size: 50px;
    color: white;
    box-shadow: 0 10px 40px rgba(103,194,58,0.4);
}

.complete-title {
    font-size: 24px;
    color: var(--dark);
    margin-bottom: 10px;
}

.complete-subtitle {
    color: var(--gray);
    margin-bottom: 40px;
}

/* =====================底部===================== */
.footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 2px solid var(--light-gray);
    text-align: center;
    color: var(--gray);
    font-size: 13px;
}

/* =====================响应式===================== */
@media (max-width: 768px) {
    .container {
        padding: 20px;
    }

    .step-indicator {
        flex-wrap: wrap;
        gap: 10px;
    }

    .step-line {
        display: none;
    }

    .step-label {
        display: none;
    }

    .splash-title {
        font-size: 24px;
    }

    .file-upload-area {
        padding: 25px;
    }

    .btn-group {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}

</style>
</head>

<body>

<!-- 启动画面 -->
<div class="splash-screen" id="splashScreen">
    <div class="splash-logo">
        <svg viewBox="0 0 24 24">
            <path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
        </svg>
    </div>
    <div class="splash-title">上海市小学均衡分班系统</div>
    <div class="splash-subtitle">均衡分班 · 公平公正 · 透明可查</div>
    <div class="splash-loader">
        <div class="splash-loader-bar"></div>
    </div>
    <div class="splash-status" id="splashStatus">正在初始化系统...</div>
</div>

<!-- 主容器 -->
<div class="container" id="mainContainer">

    <div class="process-header">
        <h1>上海市小学一年级均衡分班系统</h1>

        <!-- 步骤指示器 -->
        <div class="step-indicator">
            <div class="step-item active" data-step="1">
                <div class="step-circle">1</div>
                <span class="step-label">数据导入</span>
            </div>
            <div class="step-line"></div>
            <div class="step-item" data-step="2">
                <div class="step-circle">2</div>
                <span class="step-label">执行分班</span>
            </div>
            <div class="step-line"></div>
            <div class="step-item" data-step="3">
                <div class="step-circle">3</div>
                <span class="step-label">查看结果</span>
            </div>
            <div class="step-line"></div>
            <div class="step-item" data-step="4">
                <div class="step-circle">4</div>
                <span class="step-label">完成</span>
            </div>
        </div>
    </div>

    <!-- 步骤1：数据导入 -->
    <div class="step-content active" id="step1">
        <div class="step-intro">
            <h2>导入分班数据</h2>
            <p>请导入正式名单和预分班文件（可选）</p>
        </div>

        <div class="file-upload-area" id="formalDropZone">
            <div class="file-upload-icon">📁</div>
            <div class="file-upload-text">拖放正式名单 CSV 文件到此处</div>
            <div class="file-upload-hint">或点击选择文件 | 格式：姓名,性别,身份证号</div>
            <input type="file" id="formalInput" accept=".csv,.txt" style="display:none">
        </div>
        <div class="file-info" id="formalInfo" style="display:none">
            <span id="formalFileName"></span>
            <span id="formalFileCount"></span>
        </div>

        <div class="file-upload-area" id="presetDropZone">
            <div class="file-upload-icon">📋</div>
            <div class="file-upload-text">拖放预分班文件到此处（可选）</div>
            <div class="file-upload-hint">格式：姓名,指定班级 | 不需要可跳过</div>
            <input type="file" id="presetInput" accept=".csv,.txt" style="display:none">
        </div>
        <div class="file-info" id="presetInfo" style="display:none">
            <span id="presetFileName"></span>
            <span id="presetFileCount"></span>
        </div>

        <div class="class-config">
            <label for="classCount">分班数量：</label>
            <input type="number" id="classCount" value="8" min="2" max="20">
            <span>个班级</span>
        </div>

        <div class="btn-group">
            <button onclick="goToStep(2)" id="btnNext1">下一步，开始分班</button>
        </div>
    </div>

    <!-- 步骤2：执行分班 -->
    <div class="step-content" id="step2">
        <div class="assignment-progress">
            <div class="progress-circle">
                <div class="progress-circle-inner">
                    <div class="progress-percent" id="progressPercent">0%</div>
                    <div class="progress-label">进行中</div>
                </div>
            </div>
            <div class="assignment-status" id="assignmentStatus">正在准备分班数据...</div>
            <div class="assignment-log" id="assignmentLog"></div>
        </div>
    </div>

    <!-- 步骤3：查看结果 -->
    <div class="step-content" id="step3">
        <div class="results-header">
            <h2>分班结果统计</h2>
            <div class="results-actions">
                <button class="export" onclick="exportCSV()">导出 CSV</button>
                <button onclick="window.print()">打印</button>
            </div>
        </div>

        <div class="summary-cards" id="summaryCards"></div>

        <div class="check-list">
            <h3>透明检测</h3>
            <div id="checkResults"></div>
        </div>

        <div id="classAccordions"></div>

        <div class="btn-group">
            <button class="secondary" onclick="goToStep(1)">重新分班</button>
            <button onclick="goToStep(4)">下一步</button>
        </div>
    </div>

    <!-- 步骤4：完成 -->
    <div class="step-content" id="step4">
        <div class="complete-section">
            <div class="complete-icon">✓</div>
            <div class="complete-title">分班完成</div>
            <div class="complete-subtitle">所有学生已成功分配到各班级</div>
        </div>

        <div class="signature-section">
            <div class="signature-header">
                <h2>📜 电子签章</h2>
            </div>
            <div class="signature-grid" id="signatureGrid"></div>
            <div class="signature-signature">
                <label>监督员签字</label>
                <input type="text" class="signature-input" placeholder="请输入监督员姓名">
            </div>
        </div>

        <div class="btn-group">
            <button class="secondary" onclick="goToStep(1)">重新分班</button>
            <button class="export" onclick="exportCSV()">导出结果</button>
            <button onclick="window.print()">打印结果</button>
        </div>
    </div>

    <div class="footer">
        系统依据均衡分班原则自动生成结果
    </div>

</div>

<script>

// ============================
// 全局状态
// ============================
let students = [];
let presetStudents = [];
let classes = [];
let exportData = [];
let currentStep = 1;

// ============================
// 启动动画
// ============================
document.addEventListener('DOMContentLoaded', function() {
    const splashScreen = document.getElementById('splashScreen');
    const mainContainer = document.getElementById('mainContainer');
    const splashStatus = document.getElementById('splashStatus');

    const steps = ['正在加载配置...', '正在验证数据接口...', '正在初始化分班算法...', '系统准备就绪'];
    let stepIndex = 0;
    const statusInterval = setInterval(() => {
        if (stepIndex < steps.length) {
            splashStatus.textContent = steps[stepIndex];
            stepIndex++;
        }
    }, 450);

    setTimeout(() => {
        clearInterval(statusInterval);
        splashStatus.textContent = '系统准备就绪';
        setTimeout(() => {
            splashScreen.classList.add('fade-out');
            mainContainer.classList.add('visible');
        }, 300);
    }, 2500);
});

// ============================
// 步骤导航
// ============================
function goToStep(step) {
    currentStep = step;
    updateStepIndicator();
    showStepContent(step);

    if (step === 2) {
        runAssignment();
    }
    if (step === 3) {
        renderResults();
    }
    if (step === 4) {
        renderSignature();
    }
}

function updateStepIndicator() {
    document.querySelectorAll('.step-item').forEach(item => {
        const itemStep = parseInt(item.dataset.step);
        item.classList.remove('active', 'completed');
        if (itemStep === currentStep) {
            item.classList.add('active');
        } else if (itemStep < currentStep) {
            item.classList.add('completed');
        }
    });

    document.querySelectorAll('.step-line').forEach((line, index) => {
        line.classList.toggle('active', index < currentStep - 1);
    });
}

function showStepContent(step) {
    document.querySelectorAll('.step-content').forEach(content => {
        content.classList.remove('active');
    });
    document.getElementById('step' + step).classList.add('active');
}

// ============================
// 文件拖放
// ============================
function setupDragDrop(dropZoneId, inputId, infoId, fileNameId, fileCountId, parseFn, isRequired) {
    const dropZone = document.getElementById(dropZoneId);
    const input = document.getElementById(inputId);
    const info = document.getElementById(infoId);
    const fileName = document.getElementById(fileNameId);
    const fileCount = document.getElementById(fileCountId);

    dropZone.addEventListener('click', () => input.click());

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file, parseFn, info, fileName, fileCount);
    });

    input.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) handleFile(file, parseFn, info, fileName, fileCount);
    });
}

function handleFile(file, parseFn, info, fileName, fileCount) {
    const reader = new FileReader();
    reader.onload = e => {
        const result = parseFn(e.target.result);
        fileName.textContent = '📄 ' + file.name;
        fileCount.textContent = result.count;
        info.style.display = 'flex';
        info.className = result.valid ? 'file-info' : 'file-info error';
    };
    reader.readAsText(file, 'utf-8');
}

setupDragDrop('formalDropZone', 'formalInput', 'formalInfo', 'formalFileName', 'formalFileCount',
    text => {
        const lines = text.trim().split(/\r?\n/);
        const headers = lines[0].split(',');
        students = [];
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            const obj = {};
            headers.forEach((h, idx) => { obj[h.trim()] = (cols[idx] || '').trim(); });
            if (obj['姓名']) students.push(obj);
        }
        return { count: students.length + ' 人', valid: students.length > 0 };
    }, true);

setupDragDrop('presetDropZone', 'presetInput', 'presetInfo', 'presetFileName', 'presetFileCount',
    text => {
        const lines = text.trim().split(/\r?\n/);
        const headers = lines[0].split(',');
        presetStudents = [];
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            const obj = {};
            headers.forEach((h, idx) => { obj[h.trim()] = (cols[idx] || '').trim(); });
            if (obj['姓名']) presetStudents.push(obj);
        }
        return { count: presetStudents.length + ' 人', valid: true };
    }, false);

// ============================
// 分班逻辑
// ============================
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function generateStudentId(year, classNo, index) {
    return String(year).slice(-2) + String(classNo).padStart(2, '0') + String(index).padStart(4, '0');
}

function maskId(id) {
    if (!id) return '';
    if (id.length < 8) return id;
    return id.slice(0, 4) + "********" + id.slice(-4);
}

function runAssignment() {
    if (students.length === 0) {
        alert("请先导入正式名单");
        goToStep(1);
        return;
    }

    const progressPercent = document.getElementById('progressPercent');
    const assignmentStatus = document.getElementById('assignmentStatus');
    const assignmentLog = document.getElementById('assignmentLog');

    const classCount = parseInt(document.getElementById('classCount').value);
    classes = [];
    exportData = [];

    for (let i = 0; i < classCount; i++) classes.push([]);

    // 模拟进度
    let progress = 0;
    const progressInterval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress > 100) progress = 100;
        progressPercent.textContent = Math.round(progress) + '%';
    }, 200);

    const logs = [];
    logs.push('正在读取学生数据...');

    // 预分班锁定
    const lockedStudents = new Set();
    if (presetStudents.length > 0) {
        logs.push('正在锁定预分班学生...');
        presetStudents.forEach(p => {
            const stu = students.find(s => s['姓名'] === p['姓名']);
            if (!stu) return;
            const target = parseInt(p['指定班级']) - 1;
            if (target >= 0 && target < classCount) {
                classes[target].push(stu);
                lockedStudents.add(stu['姓名']);
            }
        });
        logs.push('已锁定 ' + lockedStudents.size + ' 名预分班学生');
    }

    logs.push('正在进行均衡分配...');

    // 剩余学生
    const remaining = students.filter(s => !lockedStudents.has(s['姓名']));
    const boys = remaining.filter(s => s['性别'] === '男');
    const girls = remaining.filter(s => s['性别'] === '女');
    shuffle(boys);
    shuffle(girls);

    function assignBalanced(arr) {
        arr.forEach(stu => {
            let minClass = 0;
            for (let i = 1; i < classCount; i++) {
                if (classes[i].length < classes[minClass].length) minClass = i;
            }
            classes[minClass].push(stu);
        });
    }

    assignBalanced(boys);
    assignBalanced(girls);

    logs.push('正在生成学号...');

    // 学号
    const year = new Date().getFullYear();
    classes.forEach((cls, classIndex) => {
        cls.sort((a, b) => a['姓名'].localeCompare(b['姓名'], 'zh'));
        cls.forEach((stu, index) => {
            stu['学号'] = generateStudentId(year, classIndex + 1, index + 1);
            stu['班级'] = '一(' + (classIndex + 1) + ')班';
            exportData.push({
                '学号': stu['学号'],
                '班级': stu['班级'],
                '姓名': stu['姓名'],
                '性别': stu['性别'],
                '身份证号': maskId(stu['身份证号'])
            });
        });
    });

    logs.push('分班完成！');

    // 显示日志
    let logIndex = 0;
    assignmentLog.innerHTML = '';
    const logInterval = setInterval(() => {
        if (logIndex < logs.length) {
            assignmentLog.innerHTML += '<p>' + logs[logIndex] + '</p>';
            logIndex++;
        }
    }, 400);

    // 完成
    setTimeout(() => {
        clearInterval(progressInterval);
        clearInterval(logInterval);
        progressPercent.textContent = '100%';
        assignmentStatus.textContent = '分班完成！正在跳转...';
        assignmentLog.innerHTML += '<p style="color: var(--secondary); font-weight: 600;">✓ 所有学生已分配完成</p>';

        // 无痕清除预分班
        presetStudents = [];
        document.getElementById('presetInput').value = '';

        setTimeout(() => goToStep(3), 1500);
    }, 2500);
}

// ============================
// 渲染结果
// ============================
function renderResults() {
    // 统计卡片
    const totalStudents = students.length;
    const totalClasses = classes.length;
    const avgPerClass = Math.round(totalStudents / totalClasses);
    const counts = classes.map(c => c.length);
    const maxDiff = Math.max(...counts) - Math.min(...counts);

    document.getElementById('summaryCards').innerHTML = `
        <div class="summary-card">
            <div class="number">${totalStudents}</div>
            <div class="label">学生总数</div>
        </div>
        <div class="summary-card">
            <div class="number">${totalClasses}</div>
            <div class="label">班级数量</div>
        </div>
        <div class="summary-card">
            <div class="number">${avgPerClass}</div>
            <div class="label">平均每班</div>
        </div>
        <div class="summary-card">
            <div class="number">${maxDiff}</div>
            <div class="label">最大差值</div>
        </div>
    `;

    // 检测结果
    const ids = exportData.map(d => d['学号']);
    const hasDuplicate = ids.length !== new Set(ids).size;

    document.getElementById('checkResults').innerHTML = `
        <div class="check-item success">
            <div class="check-icon">✓</div>
            <span>班级人数最大差值：${maxDiff}</span>
        </div>
        <div class="check-item ${hasDuplicate ? 'error' : 'success'}">
            <div class="check-icon">${hasDuplicate ? '!' : '✓'}</div>
            <span>学号重复检测：${hasDuplicate ? '存在重复' : '未发现重复'}</span>
        </div>
        <div class="check-item success">
            <div class="check-icon">✓</div>
            <span>数据完整度：${totalStudents}/${totalStudents}</span>
        </div>
    `;

    // 班级手风琴
    let accordionHtml = '';
    classes.forEach((cls, index) => {
        const males = cls.filter(s => s['性别'] === '男').length;
        const females = cls.filter(s => s['性别'] === '女').length;
        accordionHtml += `
            <div class="class-accordion">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <div class="class-info">
                        <span class="class-name">一(${index + 1})班</span>
                        <span class="class-stats">${cls.length}人（男${males}/女${females}）</span>
                    </div>
                    <span class="toggle-icon">▼</span>
                </div>
                <div class="accordion-content">
                    <table>
                        <tr>
                            <th>学号</th>
                            <th>姓名</th>
                            <th>性别</th>
                            <th>身份证号</th>
                        </tr>
                        ${cls.map(stu => `
                            <tr>
                                <td class="student-id">${stu['学号']}</td>
                                <td>${stu['姓名']}</td>
                                <td>${stu['性别']}</td>
                                <td>${maskId(stu['身份证号'])}</td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
            </div>
        `;
    });
    document.getElementById('classAccordions').innerHTML = accordionHtml;
}

function toggleAccordion(header) {
    header.classList.toggle('open');
    header.nextElementSibling.classList.toggle('open');
}

// ============================
// 电子签章
// ============================
function renderSignature() {
    const now = new Date();
    const year = now.getFullYear();
    const randomA = Math.random().toString(36).substring(2, 6).toUpperCase();
    const randomB = Math.floor(1000 + Math.random() * 9000);
    const randomC = Math.floor(1000 + Math.random() * 9000);
    const sign = `沪教分班〔${year}〕${randomA}-${randomB}-${randomC}`;
    const verifyCode = Math.random().toString(36).substring(2, 10).toUpperCase();

    document.getElementById('signatureGrid').innerHTML = `
        <div class="signature-item highlight">
            <div class="key">系统签章编号</div>
            <div class="value">${sign}</div>
        </div>
        <div class="signature-item">
            <div class="key">系统校验码</div>
            <div class="value">${verifyCode}</div>
        </div>
        <div class="signature-item">
            <div class="key">分班时间</div>
            <div class="value">${now.toLocaleString()}</div>
        </div>
        <div class="signature-item">
            <div class="key">数据状态</div>
            <div class="value">已封存</div>
        </div>
    `;
}

// ============================
// 导出CSV
// ============================
function exportCSV() {
    if (exportData.length === 0) {
        alert("请先完成分班");
        return;
    }

    let csv = "学号,班级,姓名,性别,身份证号\n";
    exportData.forEach(row => {
        csv += `${row['学号']},${row['班级']},${row['姓名']},${row['性别']},${row['身份证号']}\n`;
    });

    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = '正式分班结果.csv';
    link.click();
}

</script>

</body>
</html>
