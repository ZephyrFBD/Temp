<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>AE1111-II Engineering Drawing · 题库</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#07090e;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.075);--line:rgba(255,255,255,.09);--text:#e9edf5;--mute:#8a93a8;--a:#7cc4ff;--b:#a78bfa;--ok:#34d399;--bad:#fb7185;--r:16px}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;color:var(--text);font:16px/1.6 Inter,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;background:radial-gradient(900px 500px at 15% -10%,#1b2a52 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#2a1b52 0,transparent 55%),var(--bg);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 0,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0,#000 0,transparent 70%)}
#app{position:relative;max-width:980px;margin:0 auto;padding:34px 20px 120px}
h1,h2,h3,.num{font-family:"Space Grotesk",Inter,system-ui,sans-serif;letter-spacing:-.02em}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--a);text-transform:uppercase;font-weight:600}
.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.05;margin:10px 0 12px;font-weight:700;background:linear-gradient(120deg,#fff 20%,var(--a) 60%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);max-width:640px;margin:0}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:130px;backdrop-filter:blur(8px)}
.stat b{display:block;font:700 24px "Space Grotesk",sans-serif}.stat span{font-size:12px;color:var(--mute)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 26px}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 20px;font:600 15px Inter,system-ui,sans-serif;color:#06101c;background:linear-gradient(120deg,var(--a),var(--b));cursor:pointer;transition:transform .15s,box-shadow .2s,opacity .2s;box-shadow:0 6px 24px -8px #7cc4ff88}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px -8px #a78bfaaa}.btn:active{transform:none}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:none;border:1px solid var(--line)}.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:10px}
.grid-w{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.wk{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 20px 12px;backdrop-filter:blur(10px);transition:border-color .2s,transform .2s}
.wk:hover{border-color:#7cc4ff55;transform:translateY(-2px)}
.wk .num{position:absolute;right:14px;top:-6px;font-size:84px;font-weight:700;color:rgba(255,255,255,.05);pointer-events:none}
.wk h3{margin:0 0 14px;font-size:16px;line-height:1.3;padding-right:60px;font-weight:600}
.wk .wkn{font-size:12px;color:var(--a);letter-spacing:.15em;font-weight:600}
.set{border-top:1px solid var(--line);padding:11px 0}
.set .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:6px}
.set .meta b{color:var(--text);font-weight:600}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:4px}
.set .bt{display:flex;gap:8px;flex-wrap:wrap}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ttl{font:600 15px "Space Grotesk",Inter,sans-serif;color:var(--mute)}
.pbar{height:3px;background:var(--line);border-radius:3px;margin-bottom:14px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .4s}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.dot{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--mute);background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:all .15s}
.dot:hover{color:var(--text)}.dot.now{border-color:var(--a);color:#fff;box-shadow:0 0 0 3px #7cc4ff22}.dot.good{background:#34d3991f;border-color:#34d39966;color:var(--ok)}.dot.bad{background:#fb71851f;border-color:#fb718566;color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 28px;backdrop-filter:blur(12px);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qn{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin-bottom:12px}.qn b{font:700 15px "Space Grotesk",sans-serif;color:var(--a)}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;color:var(--b);border:1px solid #a78bfa55;border-radius:99px;padding:1px 9px;margin-bottom:10px}
.qt{font-size:18px;line-height:1.55;margin-bottom:16px}.qt p{margin:6px 0}
.paper{display:block;background:#fff;border-radius:12px;padding:8px;margin:10px auto 18px;width:fit-content;max-width:100%;box-shadow:0 12px 40px -14px #000c;cursor:zoom-in}
.paper img{display:block;max-width:100%;max-height:340px;width:auto;height:auto;margin:auto}
.list{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.grid .opt{flex-direction:column;align-items:stretch;padding:12px}
.opt:hover{background:var(--panel2);border-color:#ffffff30}.opt.sel{border-color:var(--a);background:#7cc4ff14;box-shadow:0 0 0 3px #7cc4ff1c}
.opt.ok{border-color:var(--ok);background:#34d3991c;box-shadow:0 0 0 3px #34d39922}.opt.wrong{border-color:var(--bad);background:#fb71851c;box-shadow:0 0 0 3px #fb718522}
.badge{flex:none;width:28px;height:28px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font:700 13px "Space Grotesk",sans-serif;color:var(--mute)}
.opt.sel .badge{background:var(--a);color:#06101c}.opt.ok .badge{background:var(--ok);color:#04150e}.opt.wrong .badge{background:var(--bad);color:#1c0509}
.grid .badge{align-self:flex-start}
.ot{flex:1;min-width:0}.ot p{margin:0}.ot .paper{margin:6px 0 0;width:100%}.ot .paper img{max-height:190px}
.fb{margin-top:18px;padding:13px 16px;border-radius:12px;font-weight:600;animation:in .3s}
.fb.g{background:#34d3991c;color:var(--ok);border:1px solid #34d39944}.fb.b{background:#fb71851c;color:var(--bad);border:1px solid #fb718544}
.dock{position:sticky;bottom:16px;display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;padding:12px;border-radius:16px;background:rgba(14,17,26,.8);backdrop-filter:blur(14px);border:1px solid var(--line);flex-wrap:wrap}
.dock .l,.dock .r{display:flex;gap:10px;flex-wrap:wrap}.kbd{font-size:12px;color:var(--mute)}.kbd kbd{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font:12px Inter}
.blank{width:140px;background:var(--panel2);color:var(--text);border:0;border-bottom:2px solid var(--a);border-radius:6px 6px 0 0;font:inherit;padding:1px 8px;outline:none}.okb{border-color:var(--ok);background:#34d3991c}.badb{border-color:var(--bad);background:#fb71851c}
.drag{position:relative;width:100%;border-radius:12px;background:#fff;background-size:100% 100%;background-repeat:no-repeat;margin:8px 0;box-shadow:0 12px 40px -14px #000c;overflow:hidden}
.dz{position:absolute;border:2px dashed #3b82f6;border-radius:6px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;overflow:hidden;background:#3b82f61a;transition:background .15s}.dz:hover{background:#3b82f633}
.dz.zg{border:2px solid #10b981;background:#10b9812e}.dz.zb{border:2px solid #f43f5e;background:#f43f5e26}
.dz .lab{position:absolute;top:0;left:2px;font:600 .72em Inter,sans-serif;background:#0b1020;color:#fff;padding:0 5px;border-radius:4px}
.hint{color:var(--mute);font-size:13.5px;margin:8px 0}
.tray{display:flex;flex-wrap:wrap;gap:10px;border:1px dashed var(--line);border-radius:14px;padding:12px;min-height:64px;background:var(--panel)}
.chip{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#111;border-radius:10px;padding:4px 8px;cursor:grab;font-size:14px;text-align:center;box-shadow:0 6px 18px -8px #000c;transition:transform .12s}.chip:hover{transform:translateY(-2px)}
.chip.pick{outline:3px solid var(--a)}.chip img{height:76px;max-width:170px;object-fit:contain}
.dz .chip{max-width:100%;max-height:100%;margin:0;padding:0;border-radius:0;background:none;box-shadow:none;font-size:.75em;color:#111}.dz .chip img{height:auto;max-height:100%;max-width:100%}
.lb{position:fixed;inset:0;z-index:50;background:rgba(3,5,9,.9);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:in .2s}
.lb img{max-width:94vw;max-height:92vh;background:#fff;border-radius:10px;padding:10px}
.res{text-align:center}.ring{position:relative;width:190px;height:190px;margin:10px auto 6px}.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring .c b{font:700 44px "Space Grotesk",sans-serif}.ring .c span{color:var(--mute);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0}
@media(max-width:560px){.card{padding:18px}.qt{font-size:16.5px}}
</style></head><body><div id="app"></div><script>var D=[{"week":"Week 1.1 Line Types","kind":"Practice","pool":10,"qs":[{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fb5ebb0fb1.jpg","opts":[{"h":"\u003cdiv>Thickened ends\u003c/div>\n","ok":false},{"h":"\u003cdiv>Visible Outline\u003c/div>\n","ok":false},{"h":"\u003cdiv>Thick Continuous\u003c/div>\n","ok":true}]},{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fb8058d290.jpg","opts":[{"h":"\u003cdiv>Thin Chain\u003c/div>\n","ok":true},{"h":"\u003cdiv>Thin Dashes\u003c/div>\n","ok":false},{"h":"\u003cdiv>Dotted Dashed\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fb94d2dc87.jpg","opts":[{"h":"\u003cdiv>Thin Chain\u003c/div>\n","ok":false},{"h":"\u003cdiv>Thin Dashes\u003c/div>\n","ok":true},{"h":"\u003cdiv>Dotted\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fb9876ca30.jpg","opts":[{"h":"\u003cdiv>Thin Continuous\u003c/div>\n","ok":true},{"h":"\u003cdiv>Projection Line\u003c/div>\n","ok":false},{"h":"\u003cdiv>Dimension Line\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fbacb1fb9e.jpg","opts":[{"h":"\u003cdiv>Thin Chain with thick ends and arrows and letters\u003c/div>\n","ok":true},{"h":"\u003cdiv>Thin Chain Double Dash\u003c/div>\n","ok":false},{"h":"\u003cdiv>Cutting Plane Line\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fba54b8e76.jpg","opts":[{"h":"\u003cdiv>Thin Continuous\u003c/div>\n","ok":true},{"h":"\u003cdiv>Arrow\u003c/div>\n","ok":false},{"h":"\u003cdiv>Leader\u003c/div>\n","ok":false}]}]},{"week":"Week 1.1 Line Types","kind":"Weekly Quiz","pool":10,"qs":[{"t":"mc","q":"\u003cp>A lot of the standards and conventions used in engineering drawing are automatically respected when making computer-generated drawings\u003c/p>\n","img":"","opts":[{"h":"True","ok":true},{"h":"False","ok":false}]},{"t":"mc","q":"The goal of 2D engineering drawings is to make beautiful views of a design.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Projected outlines of curved surfaces can be treated just like edges.","img":"","opts":[{"h":"True","ok":true},{"h":"False","ok":false}]},{"t":"mc","q":"An engineer can decide to show some of the hidden geometry with dashed lines.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"All parts shown next to another part in assemblies are drawn using the Thin Chain Double Dash line type.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Side views of cylindrical objects are projected as a square, and as such there is no need to place a center line.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"When using a circular hole pattern, each hole's distance from the center of the pattern needs to be indicated separately.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Leaders are lines used to indicate at what point you should start reading the technical drawing.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"A dashed line indicates a hidden feature behind the object.","img":"","opts":[{"h":"True","ok":true},{"h":"False","ok":false}]},{"t":"mc","q":"A centerline is always drawn in red to distinguish it from other line types.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"\u003cp>Extension lines are used to show the boundaries of a part or feature in a technical drawing.\u003c/p>\n","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Thin dashed lines are used to show alternate positions of moving parts in a technical drawing.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Leaders are used to point to specific features or dimensions in a technical drawing.","img":"","opts":[{"h":"True","ok":true},{"h":"False","ok":false}]},{"t":"mc","q":"What type of line is used to indicate visible outlines and edges in engineering drawings?","img":"","opts":[{"h":"Thin chain line","ok":false},{"h":"Thick continuous line","ok":true}]},{"t":"mc","q":"What type of line indicates the center of cylindrical or spherical geometry?","img":"","opts":[{"h":"Thin chain line","ok":true},{"h":"Thick continuous line","ok":false}]},{"t":"mc","q":"What is the purpose of a pitch circle in engineering drawings?","img":"","opts":[{"h":"To indicate hidden geometry","ok":false},{"h":"To show the distance of hole centers to the pattern center","ok":true}]},{"t":"mc","q":"Which line type is used to indicate symmetry in an object?","img":"","opts":[{"h":"Thin chain line","ok":true},{"h":"Thin dashed line","ok":false}]},{"t":"mc","q":"What does a thin dashed line represent in engineering drawings?","img":"","opts":[{"h":"Hidden geometry","ok":true},{"h":"Visible outlines and edges","ok":false}]},{"t":"mc","q":"What type of line is used for dimension lines in engineering drawings?","img":"","opts":[{"h":"Thin continuous line","ok":true},{"h":"Thick continuous line","ok" ":"mc","q":"Offset section views are used to reduce the number of required views by intersecting multiple features with a single cutting plane.","img":"","opts":[{"h":"True","ok":true},{"h":"False","ok":false}]},{"t":"mc","q":"In aligned section views, the cutting plane remains vertical, and the section view is foreshortened to match the actual cut.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Solid cylindrical items such as bolts and shafts are not cut in section views and are shown with their visible outlines and contours.","img":"","opts":[{"h":"True","ok":true},{"h":"False","ok":false}]},{"t":"mc","q":"How are partial section views delineated?","img":"","opts":[{"h":"Thin continuous line","ok":false},{"h":"Zig-zag or thin irregular line","ok":true}]},{"t":"mc","q":"How are auxiliary views indicated?","img":"","opts":[{"h":"By a circle","ok":false},{"h":"By an arrow and a letter","ok":true}]},{"t":"mc","q":"What is the preferred hatch pattern direction for two adjacent parts in a section view?","img":"","opts":[{"h":"30 degrees","ok":false},{"h":"45 degrees and 135 degrees","ok":true}]},{"t":"mc","q":"What term is used in CATIA for sections where no background is shown?","img":"","opts":[{"h":"Section cuts","ok":true},{"h":"Section views","ok":false}]},{"t":"mc","q":"Where should section views preferably be placed in relation to the normal orthographic projection views?","img":"","opts":[{"h":"Inside","ok":false},{"h":"Outside","ok":true}]},{"t":"mc","q":"What type of section view is used in the case of a circular object to show information about holes not actually aligned?","img":"","opts":[{"h":"Offset section view","ok":false},{"h":"Aligned section view","ok":true}]},{"t":"mc","q":"Which geometrical items may never be cut in section views?","img":"","opts":[{"h":"Ribs and bolts","ok":false},{"h":"Cylindrical items like bolts and shafts","ok":true}]}]},{"week":"Week 1.4 Conventional Representations","kind":"Practice","pool":10,"qs":[{"t":"mm","q":"\u003cp>Select the correct section view.\u003c/p>\n","img":"","opts":[{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e03126a8310.png","alt":"Incorrect 1","ok":false},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e0313e21de2.png","alt":"Correct","ok":true},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e03162b2392.png","alt":"Incorrect 2","ok":false}]},{"t":"mm","q":"\u003cp>Select the correct representation of the bolt.\u003c/p>\n","img":"","opts":[{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e0359f14159.png","alt":"Incorrect 1","ok":false},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e035a77abbc.png","alt":"Correct","ok":false},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e035aee66f0.png","alt":"Incorrect 2","ok":true}]},{"t":"mm","q":"\u003cp>Select the correct representation of the nut.\u003c/p>\n","img":"","opts":[{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e03eee5b2f7.png","alt":"Incorrect 1","ok":false},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e03ef8462ac.png","alt":"Correct","ok":true},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e03effd3a9a.png","alt":"Incorrect 2","ok":false}]},{"t":"mm","q":"\u003cp>Select the correct conventional representation of the spring.\u003c/p>\n","img":"","opts":[{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e04967b3bdb.png","alt":"Incorrect 1","ok":false},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e0496e04a31.png","alt":"Correct","ok":false},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e049769b456.png","alt":"Incorrect 2","ok":true}]},{"t":"mm","q":"\u003cp>Select all valid representations of the bearing.\u003c/p>\n","img":"","opts":[{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e05f77d1d98.png","alt":"Good Bearing 1","ok":true},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e05f9e3ac64.png","alt":"Bad Bearing 2","ok":false},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e05f9629812.png","alt":"Bad Bearing 1","ok":false},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292374239117587577/images/file-66e05fb2dffb3.png","alt":"Good Bearing 2","ok":true}]}]},{"week":"Week 1.4 Conventional Representations","kind":"Weekly Quiz","pool":10,"qs":[{"t":"mc","q":"\u003cp>Pitch circles are lines used to indicate the pitch of the threaded part of a screw or bolt.\u003c/p>\n","img":"","opts":[{"h":"Yes","ok":false},{"h":"No","ok":true}]},{"t":"mc","q":"A bolt contains an external thread, while a nut contains an internal thread.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The minor diameter of an external thread is indicated by a thick continuous line in side view drawings.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"When drawing an internal thread from the top, the broken circle represents the major diameter.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"In the case of a blind hole with a thread, the drilled length should always exceed the thread length to accommodate the tip of the tapping tool.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The major diameter of an internal thread is drawn with thick continuous lines in side view drawings.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The simplified representation of a spring can include a zig-zag line and a leader indicating the wire type.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"In section views, bolts and bearings should be hatched to indicate their material and structure.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Bearings in section views are drawn with hatched areas for the inner and outer rings, while the balls are represented by circles without hatching.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The simplified representation of a bearing includes two squares or rectangles with crossings in thin continuous lines to indicate the bearing.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"An external thread, when viewed from the front, is represented by a full circle with a broken circle inside it.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The line indicating the major diameter of an assembled screw thread changes from thin to thick where the bolt ends.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Simplified representations, such as a zig-zag line for springs, are internationally agreed upon to ensure consistency in engineering drawings.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"For an assembled screw thread in a section, the internal thread's major diameter is shown using thick continuous lines.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"What type of thread does a bolt contain?","img":"","opts":[{"h":"Internal thread","ok":false},{"h":"External thread","ok":true}]},{"t":"mc","q":"How is the outer contour of a part with an external thread drawn from the side?","img":"","opts":[{"h":"Thin continuous line","ok":false},{"h":"Thick continuous line","ok":true}]},{"t":"mc","q":"How is the minor diameter of an external thread indicated when drawn from the front?","img":"","opts":[{"h":"Broken circle","ok":true},{"h":"Full circle","ok":false}]},{"t":"mc","q":"How is the major diameter of an internal thread indicated when drawn from the top?","img":"","opts":[{"h":"Full circle","ok":false},{"h":"Broken circle","ok":true}]},{"t":"mc","q":"What do the thick lines in a thread representation indicate?","img":"","opts":[{"h":"Thread roots","ok":false},{"h":"Peaks of the thread dents","ok":true}]},{"t":"mc","q":"Why should the drilled length of a hole exceed the thread length?","img":"","opts":[{"h":"To avoid exceeding the tool's capacity","ok":false},{"h":"To provide space for the tool tip","ok":true}]},{"t":"mc","q":"How is the cone created by the drill tip in a blind hole shown in a section?","img":"","opts":[{"h":"Circle","ok":false},{"h":"Triangle","ok":true}]},{"t":"mc","q":"How is an assembled screw thread shown in a section?","img":"","opts":[{"h":"Both internal and external threads are cut","ok":false},{"h":"Bolt in the foreground, hole in the background","ok":true}]},{"t":"mc","q":"How are springs conventionally represented in engineering drawings?","img":"","opts":[{"h":"Zig-zag line","ok":true},{"h":"Detailed spring coil","ok":false}]},{"t":"mc","q":"What symbol is shown with a leader to indicate a spring made out of square wire?","img":"","opts":[{"h":"Diameter symbol","ok":false},{"h":"Square symbol","ok":true}]},{"t":"mc","q":"How should a ball bearing section be drawn to indicate the inner and outer rings?","img":"","opts":[{"h":"Hatched areas","ok":true},{"h":"Solid areas","ok":false}]},{"t":"mc","q":"What is the simplified representation for bearings in engineering drawings?","img":"","opts":[{"h":"Circles and hatching","ok":false},{"h":"Squares or rectangles with crossings","ok":true}]},{"t":"mc","q":"What type of line indicates the center line of a spring in engineering drawings?","img":"","opts":[{"h":"Thick continuous line","ok":false},{"h":"\u003cdiv>Thin chain line\u003c/div>\n","ok":true}]}]},{"week":"Week 1.5 Dimensioning Basics","kind":"Practice","pool":10,"qs":[{"t":"mc","q":"\u003cp>A partial section is used in the top view. Why?\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e442cd95a57.png","opts":[{"h":"\u003cdiv>To reveal the 1.5 radius, which now can be dimensioned since it is shown in thick continuous line type.\u003c/div>\n","ok":true},{"h":"\u003cdiv>To make the view more appealing.\u003c/div>\n","ok":false},{"h":"\u003cdiv>To show the hole position in the lug more clearly, so the datum feature can be determined.\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>A partial section is used in the left view. Why?\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e44c981dfd2.png","opts":[{"h":"\u003cdiv>To show the fact the part has a certain wall thickness.\u003c/div>\n","ok":false},{"h":"\u003cdiv>To be able to give the 28.5 dimension, indicating the depth of the rectangular groove (position of the face relative to the datum).\u003c/div>\n","ok":true},{"h":"\u003cdiv>To indicate two rectangular holes are present in the object.\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The distance between the axis line through the Ø6 holes and the datum (top) should not be given here, because:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e44dadeb50d.png","opts":[{"h":"\u003cdiv>The function would not be guaranteed.\u003c/div>\n","ok":false},{"h":"\u003cdiv>That dimension is already given in the Left View.\u003c/div>\n","ok":true},{"h":"\u003cdiv>You can make the part without that dimension.\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The R1.5 dimensions are only shown at the two bottom arcs. This is correct, because:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e44dadeb50d.png","opts":[{"h":"\u003cdiv>A symetry line is given in the view.\u003c/div>\n","ok":false},{"h":"\u003cdiv>The bottom and top arcs belong to the same feature, the fillet at the intersection of the cylinders..\u003c/div>\n","ok":true},{"h":"\u003cdiv>The diameter is not shown here.\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>You can see that horizontally two dimensions are given for the size of the bosses, the 70 and the 32.5 dimensions. Select the correct statement:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e7fbfbb1d16.png","opts":[{"h":"\u003cdiv>This is incomplete; the 37.5 of the left boss is missing.\u003c/div>\n","ok":false},{"h":"\u003cdiv>This is correct. The 37.5 can be calculated so it would be redundant.\u003c/div>\n","ok":true}]},{"t":"mc","q":"\u003cp>Observe the 7 dimension at the front view. It is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e7ff88cc90b.png","opts":[{"h":"\u003cdiv>Giving the position of the upper edge of the small rectangle relative to the front view datum (bottom edge).\u003c/div>\n","ok":false},{"h":"\u003cdiv>Is a size dimension; the 50 dimension at the left view is the position of the item relative to the datum in the vertical direction (the upper edge).\u003c/div>\n","ok":true},{"h":"\u003cdiv>It is an auxiliary dimension, since it's not important for the part to function.\u003c/div>\n","ok":false}]}]},{"week":"Week 1.5 Dimensioning Basics","kind":"Weekly Quiz","pool":10,"qs":[{"t":"mc","q":"\u003cp>Dimensions in engineering drawings are typically stated in millimetres.\u003c/p>\n","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Projection lines in engineering drawings are drawn as thick continuous lines.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"\u003cp>If units other than millimetres are used, this should be clearly indicated on the drawing.\u003c/p>","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"A diameter denotes the size of a hole or cylindrical object in engineering drawings.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The goal of dimensioning is to give all the information needed to manufacture the part shown on a drawing.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"A datum feature can only be present in one view.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The zero point in modern production techniques corresponds to the datum feature in the engineering drawing.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"In the front view of the triangular crank, the hole on the left side is the datum feature for both horizontal and vertical dimensions.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Functional dimensions are those that can be changed without affecting the functionality of the part.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The size and position of lightening holes in the triangular crank are considered functional dimensions.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Dimensions should only occur once per drawing and should not be duplicated in different views.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Auxiliary dimensions are additional dimensions provided for readability and are placed in parentheses.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"\u003cp>The size of the arc radius in the triangular crank’s lightening holes is given by a dimension followed by the numeral nine and the multiplication symbol in parenthesis.\u003c/p>","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Non-functional dimensions are essential for the part to perform its function.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"All dimensions in the front view of the triangular crank’s three main holes are functional dimensions.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"What unit is typically used for dimensions in engineering drawings?","img":"","opts":[{"h":"Millimeters","ok":true},{"h":"Inches","ok":false}]},{"t":"mc","q":"How are dimension lines typically drawn?","img":"","opts":[{"h":"Thick continuous line","ok":false},{"h":"Thin continuous line with arrowheads","ok":true}]},{"t":"mc","q":"What type of lines are projection lines in engineering drawings?","img":"","opts":[{"h":"Thin continuous lines","ok":true},{"h":"Thick continuous lines","ok":false}]},{"t":"mc","q":"What must be included if units other than millimeters are used in a drawing?","img":"","opts":[{"h":"Nothing special","ok":false},{"h":"A note on the drawing","ok":true}]},{"t":"mc","q":"Which type of dimension indicates the size of a hole or cylindrical object?","img":"","opts":[{"h":"Radius","ok":false},{"h":"Diameter","ok":true}]},{"t":"mc","q":"What does a radius dimension represent?","img":"","opts":[{"h":"The size of a full circle","ok":false},{"h":"The size of a part of a circle","ok":true}]},{"t":"mc","q":"\u003cp>What should be done if changing a dimension can change the functionality of a part?\u003c/p>","img":"","opts":[{"h":"It should be documented as a functional dimension","ok":true},{"h":"It can be ignored","ok":false}]},{"t":"mc","q":"What is a datum feature in engineering drawings?","img":"","opts":[{"h":"A feature used to start dimensions","ok":true},{"h":"An auxiliary dimension","ok":false}]},{"t":"mc","q":"How are lightening holes dimensioned in the triangular crank example?","img":"","opts":[{"h":"By the size and position relative to the datum feature","ok":true},{"h":"Randomly","ok":false}]},{"t":"mc","q":"What are functional dimensions?","img":"","opts":[{"h":"Dimensions not affecting function","ok":false},{"h":"Dimensions directly related to function","ok":true}]},{"t":"mc","q":"What is an auxiliary dimension?","img":"","opts":[{"h":"A primary dimension","ok":false},{"h":"A dimension that can be deduced from others","ok":true}]},{"t":"mc","q":"What should be done if a dimension can be deduced from other dimensions?","img":"","opts":[{"h":"It should be given again","ok":false},{"h":"It should not be repeated","ok":true}]},{"t":"mc","q":"How should dimensions be arranged when using a datum feature?","img":"","opts":[{"h":"Randomly","ok":false},{"h":"Starting from the datum feature","ok":true}]},{"t":"mc","q":"What should be done to prevent calculations by craftsmen in the tool shop?","img":"","opts":[{"h":"Provide all necessary dimensions clearly","ok":true},{"h":"Only give some dimensions","ok":false}]},{"t":"mc","q":"What can be inferred about the size and position of lightening holes in terms of their impact on function?","img":"","opts":[{"h":"They are functional dimensions","ok":false},{"h":"They are non-functional dimensions","ok":true}]}]},{"week":"Week 1.6 Dimensioning Conventions & Common Features","kind":"Practice","pool":10,"qs":[{"t":"mm","q":"\u003cp>In the this question, a pair of views of a drawing are shown. The pair contains one correct and one incorrect dimensioning example. "q":"The size of the numeral in engineering drawings should be about 3.5 millimetres.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The first dimension is placed about 8 millimetres from the geometry.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Dimension font sizes should be scaled for readability on the computer screen.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Dimensions should always be given in millimetres.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Crossing of projection lines is preferred over crossing of projection lines and geometry lines.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Projection lines should start with a small gap of about 2 millimetres from the outline.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Different scales should be used when projecting different views of a part.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Each dimension should appear only once per drawing.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Hidden lines can be used for dimensioning.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Dimensions should be placed centrally above the dimension line.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Chain dimensioning is allowed in engineering drawings.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Radii are dimensioned using a dimension line with a single arrowhead, preceded by the letter R.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Full circles should be dimensioned with the diameter symbol, a circle with a slanted line through it.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The M symbol in screw thread dimensioning captures the pitch and major and minor diameters.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Symmetry in dimensions can be indicated using the “equals to” symbol, two short dashes above each other.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"What is the standard size for numerals in dimensions?","img":"","opts":[{"h":"2.5 millimetres","ok":false},{"h":"3.5 millimetres","ok":true}]},{"t":"mc","q":"How far should the first dimension be placed from the geometry?","img":"","opts":[{"h":"10 millimetres","ok":false},{"h":"12 millimetres","ok":true}]},{"t":"mc","q":"What is the recommended spacing between subsequent dimensions?","img":"","opts":[{"h":"5 millimetres","ok":false},{"h":"8 millimetres","ok":true}]},{"t":"mc","q":"Should the font size of dimension numerals be scaled for readability on a computer screen?","img":"","opts":[{"h":"Yes","ok":false},{"h":"No","ok":true}]},{"t":"mc","q":"Where should dimensions be placed relative to the geometry?","img":"","opts":[{"h":"Inside the geometry","ok":false},{"h":"Outside the geometry","ok":true}]},{"t":"mc","q":"Which is preferred: crossing of projection lines or crossing of projection lines and geometry lines?","img":"","opts":[{"h":"Crossing of projection lines","ok":true},{"h":"Crossing of projection lines and geometry lines","ok":false}]},{"t":"mc","q":"What is the recommended gap between the outline and the start of a projection line?","img":"","opts":[{"h":"1 millimetre","ok":false},{"h":"2 millimetres","ok":true}]},{"t":"mc","q":"How should views be aligned when projecting?","img":"","opts":[{"h":"Randomly","ok":false},{"h":"Properly aligned","ok":true}]},{"t":"mc","q":"Can different scales be used when projecting views?","img":"","opts":[{"h":"Yes","ok":false},{"h":"No","ok":true}]},{"t":"mc","q":"Should each dimension appear more than once per drawing?","img":"","opts":[{"h":"Yes","ok":false},{"h":"No","ok":true}]},{"t":"mc","q":"Where should dimensions be placed if they belong to a certain feature?","img":"","opts":[{"h":"Grouped at that feature","ok":true},{"h":"Randomly placed","ok":false}]},{"t":"mc","q":"Should hidden lines be used for dimensioning?","img":"","opts":[{"h":"Yes","ok":false},{"h":"No","ok":true}]},{"t":"mc","q":"How should dimensions be placed for small dimensions if there is insufficient space for central placement?","img":"","opts":[{"h":"Inside the projection lines","ok":false},{"h":"Either side of the projection lines","ok":true}]},{"t":"mc","q":"How should radii be dimensioned?","img":"","opts":[{"h":"With a dimension line and a single arrowhead","ok":true},{"h":"With a dimension line and double arrowheads","ok":false}]},{"t":"mc","q":"What symbol is used to indicate a metric thread in dimensions?","img":"","opts":[{"h":"T","ok":false},{"h":"M","ok":true}]}]},{"week":"Week 1.7 Detail & Assembly Drawings","kind":"Practice","pool":10,"qs":[{"t":"mc","q":"\u003cp>A section view is shown. It is a view from:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292387129362239677/images/file-66e980f4dc142.png","opts":[{"h":"\u003cdiv>A detail drawing, because you can see the details of the intersected area.\u003c/div>\n","ok":false},{"h":"\u003cdiv>An assembly drawing, because multiple hatch patterns indicate multiple parts.\u003c/div>\n","ok":true}]},{"t":"mc","q":"\u003cp>The angle dimension in the left view of the assembly drawing:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292387129362239677/images/file-66e98512c45be.png","opts":[{"h":"\u003cdiv>Is not allowed, since it registers a detail of the bar.\u003c/div>\n","ok":false},{"h":"\u003cdiv>Is allowed, since it registers a dimension between multiple parts.\u003c/div>\n","ok":true}]},{"t":"bl","q":"\u003cp>Fill in the missing words\u003c/p>\n\u003cdiv>\u003cp>Drawings showing a single part are called *detail* drawings.\u003c/p>\n\u003c/div>\u003cdiv>\u003cp>Do these kind of drawings generally contain many or few dimensions? *many*\u003c/p>\n\u003c/div>\u003cdiv>\u003cp>Drawings showing multiple parts are called *assembly* drawings.\u003c/p>\n\u003c/div>\u003cdiv>\u003cp>Do these kind of drawings generally contain many or few dimensions? *few*\u003c/p>\n\u003c/div>\u003cdiv>\u003cp>A BOM can be found on *assembly* Drawings.\u003c/p>\n\u003c/div>\u003cdiv>\u003cp>A frame and *title block* can be found on both.\u003c/p>\n\u003c/div>"}]},{"week":"Week 1.7 Detail & Assembly Drawings","kind":"Weekly Quiz","pool":10,"qs":[{"t":"mc","q":"\u003cp>An assembly is composed of multiple components.\u003c/p>\n","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Detail drawings show the layout of different components in an assembly and their relative positions.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Assembly drawings include dimensions that are specific to individual parts.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The title block is located at the top right corner of any drawing.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"European engineers use the DIN-A system for drawing sheets.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"An exploded view shows all components of an assembly in their final assembled positions.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The numbers in the balloons on an assembly drawing comply with the numbers in the Bill of Material (BOM).","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The “type” column in the BOM indicates the material a part will be made from.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The hierarchy of the drawing system includes assembly drawings and detail drawings.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"In some cases, standard components like fasteners do not have detail drawings and are identified by a supplier's article number in the BOM.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The right bottom corner of the drawing is a random choice for the title block.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The Support Tube Assembly in the wing flap mechanism contains connectors which are documented in a separate detail drawing.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The title block contains information about the scale of the drawing.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Detail drawings typically contain fewer dimensions and section views than assembly drawings.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The BOM on an assembly drawing shows the quantity of each component in the assembly.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"What is an assembly composed of?","img":"","opts":[{"h":"A single component","ok":false},{"h":"Multiple components","ok":true}]},{"t":"mc","q":"What type of drawings always show a single part?","img":"","opts":[{"h":"Detail drawings","ok":true},{"h":"Assembly drawings","ok":false}]},{"t":"mc","q":"Where is the title block located on a drawing?","img":"","opts":[{"h":"Top right corner","ok":false},{"h":"Right bottom corner","ok":true}]},{"t":"mc","q":"What system do European engineers use for drawing sheets?","img":"","opts":[{"h":"DIN-A system","ok":true},{"h":"ANSI system","ok":false}]},{"t":"mc","q":"What term is commonly used to refer to the Bill of Material?","img":"","opts":[{"h":"BOM","ok":true},{"h":"BOB","ok":false}]},{"t":"mc","q":"Which type of drawing shows the layout of different components in an assembly?","img":"","opts":[{"h":"Detail drawings","ok":false},{"h":"Assembly drawings","ok":true}]},{"t":"mc","q":"What is an exploded view?","img":"","opts":[{"h":"View of components in their final position","ok":false},{"h":"View of components offset from their final position","ok":true}]},{"t":"mc","q":"What is the purpose of detail drawings?","img":"","opts":[{"h":"Show the layout of an assembly","ok":false},{"h":"Provide all information to produce a part","ok":true}]},{"t":"mc","q":"What are the main types of technical engineering drawings?","img":"","opts":[{"h":"Detail and assembly drawings","ok":true},{"h":"Layout and section drawings","ok":false}]},{"t":"mc","q":"What does the BOM typically include?","img":"","opts":[{"h":"Names and addresses of suppliers","ok":false},{"h":"Quantity, part number, and nomenclature of each component","ok":true}]},{"t":"mc","q":"What should not be included on an assembly drawing?","img":"","opts":[{"h":"Dimensions of individual parts","ok":true},{"h":"Overall dimensions of the assembly","ok":false}]},{"t":"mc","q":"What does the frame on a technical drawing do?","img":"","opts":[{"h":"Delimit the drawing","ok":true},{"h":"Provide a list of components","ok":false}]},{"t":"mc","q":"What information is contained in the title block?","img":"","opts":[{"h":"List of assembly steps","ok":false},{"h":"Information about the shown object, such as name, drawing number, and scale","ok":true}]}]}];
