ization/content/1292351774874040917/images/file-668fb5ebb0fb1.jpg","opts":[{"h":"\u003cdiv>Thickened ends\u003c/div>\n","ok":false},{"h":"\u003cdiv>Visible Outline\u003c/div>\n","ok":false},{"h":"\u003cdiv>Thick Continuous\u003c/div>\n","ok":true}]},{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fb8058d290.jpg","opts":[{"h":"\u003cdiv>Thin Chain\u003c/div>\n","ok":true},{"h":"\u003cdiv>Thin Dashes\u003c/div>\n","ok":false},{"h":"\u003cdiv>Dotted Dashed\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fb94d2dc87.jpg","opts":[{"h":"\u003cdiv>Thin Chain\u003c/div>\n","ok":false},{"h":"\u003cdiv>Thin Dashes\u003c/div>\n","ok":true},{"h":"\u003cdiv>Dotted\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fb9876ca30.jpg","opts":[{"h":"\u003cdiv>Thin Continuous\u003c/div>\n","ok":true},{"h":"\u003cdiv>Projection Line\u003c/div>\n","ok":false},{"h":"\u003cdiv>Dimension Line\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fbacb1fb9e.jpg","opts":[{"h":"\u003cdiv>Thin Chain with thick ends and arrows and letters\u003c/div>\n","ok":true},{"h":"\u003cdiv>Thin Chain Double Dash\u003c/div>\n","ok":false},{"h":"\u003cdiv>Cutting Plane Line\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The name of the highlighted line type is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292351774874040917/images/file-668fba54b8e76.jpg","opts":[{"h":"\u003cdiv>Thin Continuous\u003c/div>\n","ok":true},{"h":"\u003cdiv>Arrow\u003c/div>\n","ok":false},{"h":"\u003cdiv>Leader\u003c/div>\n","ok":false}]}]},{"week":"Week 1.1 Line Types","kind":"Weekly Quiz","pool":10,"qs":[{"t":"mc","q":"\u003cp>A lot of the standards and conventions used in engineering drawing are automatically respected when making computer-generated drawings\u003c/p>\n","img":"","opts":[{"h":"True","ok":true},{"h":"False","ok":false}]},{"t":"mc","q":"The goal of 2D engineering drawings is to make beautiful views of a design.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Projected outlines of curved surfaces can be treated just like edges.","img":"","opts":[{"h":"True","ok":true},{"h":"False","ok":false}]},{"t":"mc","q":"An engineer can decide to show some of the hidden geometry with dashed lines.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"All parts shown next to another part in assemblies are drawn using the Thin Chain Double Dash line type.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Side views of cylindrical objects are projected as a square, and as such there is no need to place a center line.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"When using a circular hole pattern, each hole's distance from the center of the pattern needs to be indicated separately.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Leaders are lines used to indicate at what point you should start reading the technical drawing.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"A dashed line indicates a hidden feature behind the object.","img":"","opts":[{"h":"True","ok":true},{"h":"False","ok":false}]},{"t":"mc","q":"A centerline is always drawn in red to distinguish it from other line types.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"\u003cp>Extension lines are used to show the boundaries of a part or feature in a technical drawing.\u003c/p>\n","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Thin dashed lines are used to show alternate positions of moving parts in a technical drawing.","img":"","opts":[{"h":"True","ok":false},{"h":"False","ok":true}]},{"t":"mc","q":"Leaders are used to point to specific features or dimensions in a technical drawing.","img":"","opts":[{"h":"True","ok":true},{"h":"False","ok":false}]},{"t":"mc","q":"What type of line is used to indicate visible outlines and edges in engineering drawings?","img":"","opts":[{"h":"Thin chain line","ok":false},{"h":"Thick continuous line","ok":true}]},{"t":"mc","q":"What type of line indicates the center of cylindrical or spherical geometry?","img":"","opts":[{"h":"Thin chain line","ok":true},{"h":"Thick continuous line","ok":false}]},{"t":"mc","q":"What is the purpose of a pitch circle in engineering drawings?","img":"","opts":[{"h":"To indicate hidden geometry","ok":false},{"h":"To show the distance of hole centers to the pattern center","ok":true}]},{"t":"mc","q":"Which line type is used to indicate symmetry in an object?","img":"","opts":[{"h":"Thin chain line","ok":true},{"h":"Thin dashed line","ok":false}]},{"t":"mc","q":"What does a thin dashed line represent in engineering drawings?","img":"","opts":[{"h":"Hidden geometry","ok":true},{"h":"Visible outlines and edges","ok":false}]},{"t":"mc","q":"What type of line is used for dimension lines in engineering drawings?","img":"","opts":[{"h":"Thin continuous line","ok":true},{"h":"Thick continuous line","ok":false}]},{"t":"mc","q":"What is the function of leaders in engineering drawings?","img":"","opts":[{"h":"To indicate an object of interest","ok":true},{"h":"To indicate symmetry","ok":false}]},{"t":"mc","q":"What line type is used to show a section view’s cutting plane?","img":"","opts":[{"h":"Thin chain double dash line","ok":false},{"h":"Thin chain with thickened ends","ok":true}]},{"t":"mc","q":"Which line type is used to indicate extreme positions of movable parts?","img":"","opts":[{"h":"Thin chain double dash line","ok":true},{"h":"Thin continuous line","ok":false}]},{"t":"mc","q":"What is the purpose of this course component?","img":"","opts":[{"h":"To learn about aesthetics in engineering","ok":false},{"h":"To learn about  rules and standards in engineering drawing","ok":true}]},{"t":"mc","q":"Why is it important to follow standards and conventions in engineering drawing?","img":"","opts":[{"h":"To create aesthetically pleasing drawings","ok":false},{"h":"To prevent miscommunication","ok":true}]},{"t":"mc","q":"What happens if center lines are not drawn for cylindrical objects?","img":"","opts":[{"h":"They might be misinterpreted as blocks","ok":true},{"h":"They appear as spheres","ok":false}]},{"t":"mc","q":"What kind of line type is used for hatching in section views?","img":"","opts":[{"h":"Thin continuous line","ok":true},{"h":"Thick continuous line","ok":false}]}]},{"week":"Week 1.2 Projection Methods","kind":"Practice","pool":10,"qs":[{"t":"mm","q":"\u003cp>A shaded Isometric View of an object is shown. The object is symmetric about the vertical plane through the cylinder axis. The face with the cylinder is defined as the front.\u003c/p>\n\n\u003cp>Select The Front View.\u003c/p>\n","img":"","opts":[{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292356786935212777/images/file-66c5b3a567eaf.png","alt":"Isometric View","ok":false},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292356786935212777/images/file-66c5b3c1367cf.png","alt":"Incorrect 02","ok":false},{"img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292356786935212777/images/file-66c5b3e312efe.png","alt":"Rear View","ok":false},{"img":"https://e s drawn with thick continuous lines in side view drawings.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The simplified representation of a spring can include a zig-zag line and a leader indicating the wire type.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"In section views, bolts and bearings should be hatched to indicate their material and structure.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Bearings in section views are drawn with hatched areas for the inner and outer rings, while the balls are represented by circles without hatching.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The simplified representation of a bearing includes two squares or rectangles with crossings in thin continuous lines to indicate the bearing.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"An external thread, when viewed from the front, is represented by a full circle with a broken circle inside it.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The line indicating the major diameter of an assembled screw thread changes from thin to thick where the bolt ends.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Simplified representations, such as a zig-zag line for springs, are internationally agreed upon to ensure consistency in engineering drawings.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"For an assembled screw thread in a section, the internal thread's major diameter is shown using thick continuous lines.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"What type of thread does a bolt contain?","img":"","opts":[{"h":"Internal thread","ok":false},{"h":"External thread","ok":true}]},{"t":"mc","q":"How is the outer contour of a part with an external thread drawn from the side?","img":"","opts":[{"h":"Thin continuous line","ok":false},{"h":"Thick continuous line","ok":true}]},{"t":"mc","q":"How is the minor diameter of an external thread indicated when drawn from the front?","img":"","opts":[{"h":"Broken circle","ok":true},{"h":"Full circle","ok":false}]},{"t":"mc","q":"How is the major diameter of an internal thread indicated when drawn from the top?","img":"","opts":[{"h":"Full circle","ok":false},{"h":"Broken circle","ok":true}]},{"t":"mc","q":"What do the thick lines in a thread representation indicate?","img":"","opts":[{"h":"Thread roots","ok":false},{"h":"Peaks of the thread dents","ok":true}]},{"t":"mc","q":"Why should the drilled length of a hole exceed the thread length?","img":"","opts":[{"h":"To avoid exceeding the tool's capacity","ok":false},{"h":"To provide space for the tool tip","ok":true}]},{"t":"mc","q":"How is the cone created by the drill tip in a blind hole shown in a section?","img":"","opts":[{"h":"Circle","ok":false},{"h":"Triangle","ok":true}]},{"t":"mc","q":"How is an assembled screw thread shown in a section?","img":"","opts":[{"h":"Both internal and external threads are cut","ok":false},{"h":"Bolt in the foreground, hole in the background","ok":true}]},{"t":"mc","q":"How are springs conventionally represented in engineering drawings?","img":"","opts":[{"h":"Zig-zag line","ok":true},{"h":"Detailed spring coil","ok":false}]},{"t":"mc","q":"What symbol is shown with a leader to indicate a spring made out of square wire?","img":"","opts":[{"h":"Diameter symbol","ok":false},{"h":"Square symbol","ok":true}]},{"t":"mc","q":"How should a ball bearing section be drawn to indicate the inner and outer rings?","img":"","opts":[{"h":"Hatched areas","ok":true},{"h":"Solid areas","ok":false}]},{"t":"mc","q":"What is the simplified representation for bearings in engineering drawings?","img":"","opts":[{"h":"Circles and hatching","ok":false},{"h":"Squares or rectangles with crossings","ok":true}]},{"t":"mc","q":"What type of line indicates the center line of a spring in engineering drawings?","img":"","opts":[{"h":"Thick continuous line","ok":false},{"h":"\u003cdiv>Thin chain line\u003c/div>\n","ok":true}]}]},{"week":"Week 1.5 Dimensioning Basics","kind":"Practice","pool":10,"qs":[{"t":"mc","q":"\u003cp>A partial section is used in the top view. Why?\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e442cd95a57.png","opts":[{"h":"\u003cdiv>To reveal the 1.5 radius, which now can be dimensioned since it is shown in thick continuous line type.\u003c/div>\n","ok":true},{"h":"\u003cdiv>To make the view more appealing.\u003c/div>\n","ok":false},{"h":"\u003cdiv>To show the hole position in the lug more clearly, so the datum feature can be determined.\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>A partial section is used in the left view. Why?\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e44c981dfd2.png","opts":[{"h":"\u003cdiv>To show the fact the part has a certain wall thickness.\u003c/div>\n","ok":false},{"h":"\u003cdiv>To be able to give the 28.5 dimension, indicating the depth of the rectangular groove (position of the face relative to the datum).\u003c/div>\n","ok":true},{"h":"\u003cdiv>To indicate two rectangular holes are present in the object.\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The distance between the axis line through the Ø6 holes and the datum (top) should not be given here, because:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e44dadeb50d.png","opts":[{"h":"\u003cdiv>The function would not be guaranteed.\u003c/div>\n","ok":false},{"h":"\u003cdiv>That dimension is already given in the Left View.\u003c/div>\n","ok":true},{"h":"\u003cdiv>You can make the part without that dimension.\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>The R1.5 dimensions are only shown at the two bottom arcs. This is correct, because:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e44dadeb50d.png","opts":[{"h":"\u003cdiv>A symetry line is given in the view.\u003c/div>\n","ok":false},{"h":"\u003cdiv>The bottom and top arcs belong to the same feature, the fillet at the intersection of the cylinders..\u003c/div>\n","ok":true},{"h":"\u003cdiv>The diameter is not shown here.\u003c/div>\n","ok":false}]},{"t":"mc","q":"\u003cp>You can see that horizontally two dimensions are given for the size of the bosses, the 70 and the 32.5 dimensions. Select the correct statement:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e7fbfbb1d16.png","opts":[{"h":"\u003cdiv>This is incomplete; the 37.5 of the left boss is missing.\u003c/div>\n","ok":false},{"h":"\u003cdiv>This is correct. The 37.5 can be calculated so it would be redundant.\u003c/div>\n","ok":true}]},{"t":"mc","q":"\u003cp>Observe the 7 dimension at the front view. It is:\u003c/p>\n","img":"https://eu-west-1.cdn.h5p.com/orgs/1290481804686024177/organization/content/1292376821514365947/images/file-66e7ff88cc90b.png","opts":[{"h":"\u003cdiv>Giving the position of the upper edge of the small rectangle relative to the front view datum (bottom edge).\u003c/div>\n","ok":false},{"h":"\u003cdiv>Is a size dimension; the 50 dimension at the left view is the position of the item relative to the datum in the vertical direction (the upper edge).\u003c/div>\n","ok":true},{"h":"\u003cdiv>It is an auxiliary dimension, since it's not important for the part to function.\u003c/div>\n","ok":false}]}]},{"week":"Week 1.5 Dimensioning Basics","kind":"Weekly Quiz","pool":10,"qs":[{"t":"mc","q":"\u003cp>Dimensions in engineering drawings are typically stated in millimetres.\u003c/p>\n","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Projection lines in engineering drawings are drawn as thick continuous lines.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"\u003cp>If units other than millimetres are used, this should be clearly indicated on the drawing.\u003c/p>","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"A diameter denotes the size of a hole or cylindrical object in engineering drawings.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"The goal of dimensioning is to give all the information needed to manufacture the part shown on a drawing.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"A datum feature can only be present in one view.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The zero point in modern production techniques corresponds to the datum feature in the engineering drawing.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"In the front view of the triangular crank, the hole on the left side is the datum feature for both horizontal and vertical dimensions.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Functional dimensions are those that can be changed without affecting the functionality of the part.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"The size and position of lightening holes in the triangular crank are considered functional dimensions.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"Dimensions should only occur once per drawing and should not be duplicated in different views.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Auxiliary dimensions are additional dimensions provided for readability and are placed in parentheses.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"\u003cp>The size of the arc radius in the triangular crank’s lightening holes is given by a dimension followed by the numeral nine and the multiplication symbol in parenthesis.\u003c/p>","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"Non-functional dimensions are essential for the part to perform its function.","img":"","opts":[{"h":"TRUE","ok":false},{"h":"FALSE","ok":true}]},{"t":"mc","q":"All dimensions in the front view of the triangular crank’s three main holes are functional dimensions.","img":"","opts":[{"h":"TRUE","ok":true},{"h":"FALSE","ok":false}]},{"t":"mc","q":"What unit is typically used for dimensions in engineering drawings?","img":"","opts":[{"h":"Millimeters","ok":true},{"h":"Inches","ok":false}]},{"t":"mc","q":"How are dimension lines typically drawn?","img":"","opts":[{"h":"Thick continuous line","ok":false},{"h":"Thin continuous line with arrowheads","ok":true}]},{"t":"mc","q":"What type of lines are projection lines in engineering drawings?","img":"","opts":[{"h":"Thin continuous lines","ok":true},{"h":"Thick continuous lines","ok":false}]},{"t":"mc","q":"What must be included if units other than millimeters are used in a drawing?","img":"","opts":[{"h":"Nothing special","ok":false},{"h":"A note on the drawing","ok":true}]},{"t":"mc","q":"Which type of dimension indicates the size of a hole or cylindrical object?","img":"","opts":[{"h":"Radius","ok":false},{"h":"Diameter","ok":true}]},{"t":"mc","q":"What does a radius dimension represent?","img":"","opts":[{"h":"The size of a full circle","ok":false},{"h":"The size of a part of a circle","ok":true}]},{"t":"mc","q":"\u003cp>What should be done if changing a dimension can change the functionality of a part?\u003c/p>","img":"","opts":[{"h":"It should be documented as a functional dimension","ok":true},{"h":"It can be ignored","ok":false}]},{"t":"mc","q":"What is a datum feature in engineering drawings?","img":"","op  st.checked=true;st.ok=ok;st.pick=null;render()}
function dgShow(q,st){st.place={};q.zones.forEach(function(z,zi){st.place[zi]=z.ce.slice()})}
function render(){
 var y=window.scrollY;var r=document.getElementById('app');r.innerHTML='';
 var qi=cur.list[cur.i],q=cur.s.qs[qi],st=cur.st[qi]||(cur.st[qi]={});
 var top=el('div','top');top.appendChild(btn('← 目录',home,'btn ghost'));top.appendChild(el('span','ttl',cur.s.week+' · '+cur.s.kind));r.appendChild(top);
 var pr=el('div','prog');cur.list.forEach(function(k,j){var s2=cur.st[k];var d=el('span','dot'+(j===cur.i?' now':'')+(s2&&s2.checked?(s2.ok?' good':' bad'):''),String(j+1));d.onclick=function(){cur.i=j;render()};pr.appendChild(d)});r.appendChild(pr);
 var card=el('div','card');card.appendChild(el('div','qn','第 '+(cur.i+1)+' / '+cur.list.length+' 题'));
 var body=el('div','qb');card.appendChild(body);R[q.t](q,st,body);
 if(st.checked){var f=el('div','fb '+(st.ok?'g':'b'),st.ok?'✓ 正确':'✗ 不正确（绿色为正确答案）');
  if(q.t==='bl'&&!st.ok)f.innerHTML+='　正确答案：'+st.ans.join(' ， ');card.appendChild(f)}
 var bar=el('div','bar');
 var pv=btn('上一题',function(){cur.i--;render()},'btn ghost');pv.disabled=cur.i===0;bar.appendChild(pv);
 var ck=btn(st.checked?'已检查':'检查答案',function(){check(q,st)});ck.disabled=!!st.checked;bar.appendChild(ck);
 if(q.t==='dg'&&st.checked&&!st.ok&&!st.shown)bar.appendChild(btn('显示正确答案',function(){dgShow(q,st);st.shown=1;render()},'btn ghost'));
 var last=cur.i===cur.list.length-1;
 bar.appendChild(btn(last?'完成':'下一题',function(){if(last)finish();else{cur.i++;render()}},'btn'));
 card.appendChild(bar);r.appendChild(card);
 if(q.t==='dg'){var c=card.querySelector('.drag');var f2=function(){c.style.fontSize=(16*c.clientWidth/q.W)+'px'};f2();window.onresize=f2}
 window.scrollTo(0,y)}
function finish(){
 var r=document.getElementById('app');r.innerHTML='';var tot=cur.list.length,ok=0;
 cur.list.forEach(function(k){if(cur.st[k]&&cur.st[k].ok)ok++});
 var c=el('div','card');c.appendChild(el('h2','',cur.s.week+' · '+cur.s.kind+' 结果'));c.appendChild(el('div','sc',ok+' / '+tot));
 cur.list.forEach(function(k,j){var s2=cur.st[k];var m=!s2||!s2.checked?'○ 未检查':(s2.ok?'✓ 正确':'✗ 错误');var d=el('div','ri','第 '+(j+1)+' 题　'+m);d.onclick=function(){cur.i=j;render()};c.appendChild(d)});
 var bar=el('div','bar');bar.appendChild(btn('← 目录',home,'btn ghost'));
 var wrong=cur.list.filter(function(k){return !(cur.st[k]&&cur.st[k].ok)});
 if(wrong.length)bar.appendChild(btn('只重做未做对的（'+wrong.length+'）',function(){cur.list=wrong;cur.i=0;wrong.forEach(function(k){delete cur.st[k]});render()}));
 c.appendChild(bar);r.appendChild(c);window.scrollTo(0,0)}
home();
</script></body></html>
